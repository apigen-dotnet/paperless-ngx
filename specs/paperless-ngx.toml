prune = true
# ApiGenerator Configuration File for Paperless-ngx
# This file configures how C# models and API clients are generated from OpenAPI specifications

output_path = "src"
target_framework = "net10.0"
generate_nullable_reference_types = true
generate_data_annotations = true

# Global using statements added to all generated files
global_usings = [
    "System.Text.Json.Serialization"
]

[[specs]]
path = "specs/paperless-ngx.yaml"
path_prefix = ""

# Models Generation Settings
[models]
namespace = "Apigen.PaperlessNgx.Models"
project_name = "Apigen.PaperlessNgx.Models"

# Model generation strategy
[model_generation]
strategy = "SeparateWithDeduplication"  # Options: "AlwaysSeparate", "SeparateWithDeduplication", "SingleModel"
request_suffix = "Request"
response_suffix = ""
generate_to_request_extensions = true

# Enum generation configuration
[enum_generation]
generation_mode = "Smart"  # Paperless uses integer enums, needs smart name generation
unknown_value_handling = "UseDefault"
add_description_attributes = true
add_json_string_enum_converter = false  # Integer enums need custom converter

[enum_generation.name_generation]
remove_words = ["Type", "Types"]
casing = "PascalCase"
max_length = 50
handle_numbers = "prefix_underscore"
invalid_char_replacement = ""
preserve_acronyms = true

# JSON Serialization Settings
[serialization]
nullable_for_optional_properties = true  # Make optional value types nullable (e.g., int? instead of int)
ignore_condition = "WhenWritingNull"  # Don't serialize null values

# API Client Generation Settings
[client]
generate_client = true
namespace = "Apigen.PaperlessNgx.Client"
project_name = "Apigen.PaperlessNgx.Client"
client_class_name = "PaperlessNgxApiClient"
use_async_suffix = true
generate_interfaces = true
use_ilogger = true

# Request class organization
[client.request_organization]
strategy = "individual_files"  # Options: "single_file", "individual_files", "by_resource"
directory = "Requests"
include_base_classes = true

# Authentication settings (paperless-ngx supports token auth)
[client.authentication]
token_header = "Authorization"
required_headers = []

# Naming convention overrides
[naming]
overrides = { "longtext" = "LongText", "documentlink" = "DocumentLink" }

# POST /api/documents/delete/ is a bulk operation; without this it becomes a second
# DeleteAsync next to deleting a single document.
# The names below are human choices, not something the generator can derive: the spec speaks
# Django REST framework ("retrieve", "destroy", "create"), which says how the endpoint is wired
# rather than what it does. DownloadRetrieveAsync reads as "retrieve a download".
operation_id_overrides = { "documents_delete" = "BulkDelete", "documents_download_retrieve" = "Download", "documents_preview_retrieve" = "Preview", "documents_thumb_retrieve" = "Thumbnail", "documents_metadata_retrieve" = "GetMetadata", "documents_next_asn_retrieve" = "GetNextAsn", "documents_notes_destroy" = "DeleteNote", "documents_selection_data_create" = "GetSelectionData", "tasks_status_counts_retrieve" = "GetStatusCounts", "profile_totp_destroy" = "DisableTotp", "users_deactivate_totp_create" = "DeactivateTotp" }

# Code formatting preferences
[formatting]
use_spaces = true
indent_width = 2

# Auto-generated file headers
[header]
include_header = true
include_timestamp = false
include_source = true
include_generator_info = true
include_config_info = false
custom_text = "Paperless-ngx API Models - Auto-generated from OpenAPI specification"

# Type name overrides to avoid conflicts
[[type_name_overrides]]
original_name = "Oauth"
new_name = "OAuth"
reason = "Proper casing for OAuth acronym"

[[type_name_overrides]]
pattern = "RequestRequest$"
new_name = "Request"
reason = "Remove duplicate Request suffix from upstream Django naming (EmailDocumentRequestRequest, NoteCreateRequestRequest, BulkDeleteMailRequestRequest)"

[[type_name_overrides]]
pattern = "TaskSerializerV10"
new_name = "PaperlessTask"
reason = "Django serializer class name; also covers TaskSerializerV10StatusEnum and PaginatedTaskSerializerV10List"

[[type_name_overrides]]
original_name = "Notes"
new_name = "Note"
reason = "Schema describes a single note, not a collection"

[[type_name_overrides]]
original_name = "NotesRequest"
new_name = "NoteRequest"
reason = "Schema describes a single note, not a collection"

[[type_name_overrides]]
original_name = "Tasks"
new_name = "TaskQueueStatus"
applies_to = "schemas"
reason = "Redis/celery block of SystemStatus, unrelated to the tasks API; must not rename the tasks resource client"

[[type_name_overrides]]
original_name = "Index"
new_name = "SearchIndexStatus"
reason = "Search index block of SystemStatus; bare Index is ambiguous with System.Index for callers"

[[type_name_overrides]]
original_name = "Storage"
new_name = "StorageStatus"
reason = "Storage block of SystemStatus"

[[type_name_overrides]]
original_name = "Database"
new_name = "DatabaseStatus"
reason = "Database block of SystemStatus"

[[type_name_overrides]]
original_name = "AcknowledgeTasks"
new_name = "AcknowledgeTasksResult"
reason = "Schema is the response of the acknowledge call, not the action"

[[type_name_overrides]]
original_name = "AcknowledgeTasksViewRequest"
new_name = "AcknowledgeTasksRequest"
reason = "View is the Django view name, not part of the API"

[[type_name_overrides]]
original_name = "UiSettingsView"
new_name = "UiSettings"
reason = "View is the Django view name, not part of the API"

[[type_name_overrides]]
original_name = "UiSettingsViewRequest"
new_name = "UiSettingsRequest"
reason = "View is the Django view name, not part of the API"

# Names for object schemas that the spec leaves inline and therefore anonymous
[[inline_type_names]]
property_filter = "^(set_)?permissions$"
name = "PermissionsSet"

[[inline_type_names]]
property_filter = "^(view|change)$"
schema_filter = "^PermissionsSet$"
name = "PermissionsMembers"



# Response type overrides for API spec mismatches
[[response_type_overrides]]
operation_filter = "documents_notes_create"
original_type = "PaginatedNotesList"
target_type = "List<Note>"
reason = "API returns array of Notes, not paginated list"
